# Builds the CadetFlow Android app (android-app/) and publishes it as CadetFlow.apk on the
# "android-app" GitHub release, which the site links to:
#   https://github.com/pathakabhinav777/cadetmanagement/releases/latest/download/CadetFlow.apk
# The app opens the live site, so ordinary website changes do NOT need a new APK. This runs when
# android-app/ or this file changes, or by hand from the Actions tab ("Run workflow").
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64 (a PKCS12 keystore, base64),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are set, the APK is signed with that key so
# new versions install over old ones. Without them a throwaway debug key is used.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0C1626'
          npx cap sync android

      - name: Set the version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew --no-daemon assembleRelease
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --out "$GITHUB_WORKSPACE/CadetFlow.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/CadetFlow.apk"
            rm -f "$RUNNER_TEMP/key.p12"
          else
            echo "::warning::No signing key secrets set; building a debug-signed APK."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CadetFlow.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/CadetFlow.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CadetFlow-apk
          path: CadetFlow.apk

      - name: Publish the APK on the "android-app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          NOTES="CadetFlow for Android, build ${GITHUB_RUN_NUMBER}. Download CadetFlow.apk, open it, and allow installing from this source if Android asks. The app opens the live CadetFlow site, so it stays up to date by itself."
          if gh release view android-app >/dev/null 2>&1; then
            gh release upload android-app CadetFlow.apk --clobber
            gh release edit android-app --title "CadetFlow Android app" --notes "$NOTES" --latest
          else
            gh release create android-app CadetFlow.apk --title "CadetFlow Android app" --notes "$NOTES" --latest
          fi
